version: '3'

env:
  # Pin Go 1.26.2 to match go.mod (go 1.26) and WSL golangci-lint built with Go 1.26.
  GOTOOLCHAIN: go1.26.2

tasks:
  lint:
    desc: Run golangci-lint (errcheck, govet, ineffassign, nolintlint, staticcheck, unused)
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run Go tests with race detector (goleak enforced in tests)
    cmds:
      - go test -race -count=1 ./...

  check:
    desc: Run lint and race-checked tests
    cmds:
      - task: lint
      - task: test
