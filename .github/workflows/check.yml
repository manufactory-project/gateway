name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          install-only: true

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0

      - name: Install pinned shellcheck
        run: |
          set -euo pipefail
          ver=v0.11.0
          sha256=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          tmp="$(mktemp -d)"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${ver}/shellcheck-${ver}.linux.x86_64.tar.xz" -o "${tmp}/sc.tar.xz"
          echo "${sha256}  ${tmp}/sc.tar.xz" | sha256sum -c -
          tar -xJf "${tmp}/sc.tar.xz" -C "${tmp}"
          sudo install -m 0755 "${tmp}/shellcheck-${ver}/shellcheck" /usr/local/bin/shellcheck
          rm -rf "${tmp}"
          shellcheck --version

      - name: Run task check
        run: task check

      - name: Lint E2E harness
        run: |
          bash -n e2e/run.sh
          shellcheck -S warning e2e/run.sh
