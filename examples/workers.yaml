# paths to be confirmed during worker cutover
#
# Three-link worker example: one principal per subscription CLI vendor
# (claude, codex, agy), exact hosts only, path-scoped API rules, and
# permanent POST token-refresh rules. No skill/plugin download rules and
# no telemetry hosts.

ca:
  cert_path: /etc/gateway/ca/ca.crt
  key_path: /etc/gateway/ca/ca.key

audit:
  dir: /var/log/gateway/audit
  retain_days: 30
  max_file_bytes: 104857600
  stdout_json: true

admin:
  socket: /run/gateway/admin.sock
  socket_group: gateway

metrics:
  listen: 127.0.0.1:9102

dataplane:
  verify_sysctls: true
  ready_file: /run/gateway-dataplane/dataplane.ready
  dhcp:
    user: dnsmasq
    lease_file: /var/lib/gateway/dnsmasq.leases
    config_path: /run/gateway-dataplane/dnsmasq.conf
    lease_time: 12h

dns:
  fake_cidr: 198.18.0.0/15
  ttl_seconds: 60

http:
  max_request_body_bytes: 33554432
  ws_max_egress_bytes: 67108864
  max_header_bytes: 32768

links:
  - name: sbx0
    interface: sbx0
    principal: worker-claude
    subnet: 10.200.0.0/28
    gateway_ip: 10.200.0.1
    https_port: 10443
    http_port: 10080
    dns_port: 10053
    ct_zone: 101
    route_table: 101

  - name: sbx1
    interface: sbx1
    principal: worker-codex
    subnet: 10.200.0.16/28
    gateway_ip: 10.200.0.17
    https_port: 10443
    http_port: 10080
    dns_port: 10053
    ct_zone: 102
    route_table: 102

  - name: sbx2
    interface: sbx2
    principal: worker-agy
    subnet: 10.200.0.32/28
    gateway_ip: 10.200.0.33
    https_port: 10443
    http_port: 10080
    dns_port: 10053
    ct_zone: 103
    route_table: 103

rules:
  # claude: exact API host, path-scoped (no skill/plugin downloads, no event_logging)
  - id: claude-messages
    principal: worker-claude
    effect: allow
    hosts: [api.anthropic.com]
    ports: [443]
    methods: [POST]
    paths: ["/v1/messages"]

  - id: claude-cli-session
    principal: worker-claude
    effect: allow
    hosts: [api.anthropic.com]
    ports: [443]
    methods: [GET]
    paths:
      - "/api/oauth/profile"
      - "/api/oauth/account/settings"
      - "/api/oauth/claude_cli/roles"
      - "/api/claude_cli/bootstrap"

  - id: claude-token-refresh
    principal: worker-claude
    effect: allow
    hosts: [platform.claude.com]
    ports: [443]
    methods: [POST]
    paths: ["/v1/oauth/token"]

  # codex: exact API host, WebSocket opted-in on this rule only
  - id: codex-api
    principal: worker-codex
    effect: allow
    hosts: [chatgpt.com]
    ports: [443]
    methods: [GET, POST]
    paths: ["/backend-api/codex/**"]
    allow_websocket: true

  - id: codex-token-refresh
    principal: worker-codex
    effect: allow
    hosts: [auth.openai.com]
    ports: [443]
    methods: [POST]
    paths: ["/oauth/token"]

  # agy: exact API hosts, path-scoped
  - id: agy-cloudcode
    principal: worker-agy
    effect: allow
    hosts:
      - daily-cloudcode-pa.googleapis.com
      - cloudcode-pa.googleapis.com
    ports: [443]
    methods: [GET, POST]
    paths:
      - "/v1internal:*"
      - "/v1internal/**"

  - id: agy-config
    principal: worker-agy
    effect: allow
    hosts: [aicode.googleapis.com]
    ports: [443]
    methods: [GET]
    paths: ["/v1alpha:fetchConfig"]

  - id: agy-token-refresh
    principal: worker-agy
    effect: allow
    hosts: [oauth2.googleapis.com]
    ports: [443]
    methods: [POST]
    paths: ["/token"]
